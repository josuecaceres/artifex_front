<div class="page">
  <div class="page__head">
    <h1>Empresas</h1>
    <button mat-flat-button type="button" (click)="openCreate()">
      <fa-icon [icon]="icons.add" />
      Nueva empresa
    </button>
  </div>

  @if (errorMessage(); as message) {
    <div class="app-alert" role="alert">
      <fa-icon class="app-alert__icon" [icon]="icons.warning" />
      <span>{{ message }}</span>
    </div>
  } @else if (loading()) {
    <mat-spinner diameter="32" />
  } @else if (dataSource.data.length === 0) {
    <p>No hay empresas todavía.</p>
  }

  <div
    class="page__table"
    [class.page__table--hidden]="dataSource.data.length === 0"
  >
    <table mat-table matSort [dataSource]="dataSource" aria-label="Empresas">
      <ng-container matColumnDef="comercial_name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Nombre comercial
        </th>
        <td mat-cell *matCellDef="let row">{{ row.comercial_name }}</td>
      </ng-container>

      <ng-container matColumnDef="nit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>NIT</th>
        <td mat-cell *matCellDef="let row">{{ row.nit }}</td>
      </ng-container>

      <ng-container matColumnDef="nrc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>NRC</th>
        <td mat-cell *matCellDef="let row">{{ row.nrc }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button
            mat-icon-button
            type="button"
            [attr.aria-label]="'Editar ' + row.comercial_name"
            (click)="openEdit(row)"
          >
            <fa-icon [icon]="icons.edit" />
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
  <mat-paginator
    [class.page__table--hidden]="dataSource.data.length === 0"
    [pageSize]="10"
    [pageSizeOptions]="[10, 25, 50]"
    aria-label="Paginación de empresas"
  />
</div>
